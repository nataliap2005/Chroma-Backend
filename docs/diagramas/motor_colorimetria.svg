<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="470" viewBox="0 0 1760 470"><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6466"/></marker><marker id="pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6466"/></marker></defs><rect width="1760" height="470" fill="#fffaf7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7e1738" font-weight="bold" text-anchor="start">Motor de colorimetría y compatibilidad (reglas actuales)</text><text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6f6466" font-weight="normal" text-anchor="start">Heurística explicable: cada respuesta suma evidencia en cuatro ejes; el modelo de IA la complementará</text><rect x="40" y="200" width="230" height="150" rx="14" fill="#f9e9ee" stroke="#c98a9e" stroke-width="2"/><text x="155.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">27 respuestas</text><text x="155.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">piel, venas, joyas,</text><text x="155.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">cabello, ojos, colores</text><rect x="330" y="140" width="280" height="270" rx="14" fill="#f3e3f0" stroke="#a7739a" stroke-width="2"/><text x="470.0" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">4 ejes de color</text><text x="470.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">temperatura: frío ↔ cálido</text><text x="470.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">profundidad: claro ↔ profundo</text><text x="470.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">saturación: suave ↔ brillante</text><text x="470.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">contraste: bajo ↔ alto</text><text x="470.0" y="335.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">(cada pista tiene un peso)</text><rect x="670" y="200" width="250" height="150" rx="14" fill="#f3e3f0" stroke="#a7739a" stroke-width="2"/><text x="795.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">12 estaciones</text><text x="795.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">distancia a cada</text><text x="795.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">perfil de referencia</text><rect x="980" y="200" width="250" height="150" rx="14" fill="#f3e3f0" stroke="#a7739a" stroke-width="2"/><text x="1105.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Resultado</text><text x="1105.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">estación, subtono,</text><text x="1105.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">paleta y confianza</text><rect x="1290" y="110" width="430" height="330" rx="14" fill="#e4f4ec" stroke="#6fb391" stroke-width="2"/><text x="1505.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Compatibilidad 0–100</text><text x="1505.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">por cada producto del catálogo:</text><text x="1505.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle"></text><text x="1505.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">claridad del tono · 28</text><text x="1505.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">subtono · 25</text><text x="1505.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">estación · 17</text><text x="1505.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">tipo de piel · 10</text><text x="1505.0" y="335.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">acabado · 10</text><text x="1505.0" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">presupuesto · 10</text><text x="1505.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6466" font-weight="normal" text-anchor="middle">+ ajuste por la opinión de la usuaria</text><line x1="270" y1="275" x2="330" y2="275" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><line x1="610" y1="275" x2="670" y2="275" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><line x1="920" y1="275" x2="980" y2="275" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><line x1="1230" y1="275" x2="1290" y2="275" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/></svg>
