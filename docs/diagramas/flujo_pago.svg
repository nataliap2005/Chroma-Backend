<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6466"/></marker><marker id="pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6466"/></marker></defs><rect width="1600" height="820" fill="#fffaf7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7e1738" font-weight="bold" text-anchor="start">Flujo de pago (Wompi)</text><text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6f6466" font-weight="normal" text-anchor="start">El plan se activa por el evento firmado de Wompi o al volver a la app; nunca dos veces</text><rect x="40" y="120" width="220" height="60" rx="14" fill="#f9e9ee" stroke="#c98a9e" stroke-width="2"/><text x="150.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">App</text><line x1="150" y1="180" x2="150" y2="780" stroke="#d9cdc9" stroke-width="2" stroke-dasharray="6 6"/><rect x="370" y="120" width="220" height="60" rx="14" fill="#f3e3f0" stroke="#a7739a" stroke-width="2"/><text x="480.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Chroma API</text><line x1="480" y1="180" x2="480" y2="780" stroke="#d9cdc9" stroke-width="2" stroke-dasharray="6 6"/><rect x="700" y="120" width="220" height="60" rx="14" fill="#e4f4ec" stroke="#6fb391" stroke-width="2"/><text x="810.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Supabase</text><line x1="810" y1="180" x2="810" y2="780" stroke="#d9cdc9" stroke-width="2" stroke-dasharray="6 6"/><rect x="1030" y="120" width="220" height="60" rx="14" fill="#eef0f4" stroke="#9aa3b5" stroke-width="2"/><text x="1140.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Wompi</text><line x1="1140" y1="180" x2="1140" y2="780" stroke="#d9cdc9" stroke-width="2" stroke-dasharray="6 6"/><rect x="1340" y="120" width="220" height="60" rx="14" fill="#eef0f4" stroke="#9aa3b5" stroke-width="2"/><text x="1450.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24191a" font-weight="bold" text-anchor="middle">Resend</text><line x1="1450" y1="180" x2="1450" y2="780" stroke="#d9cdc9" stroke-width="2" stroke-dasharray="6 6"/><line x1="158" y1="230" x2="472" y2="230" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="187.88" y="202.0" width="254.24" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="315.0" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">1. POST /checkout (plan + sesión)</text><line x1="488" y1="290" x2="802" y2="290" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="532.4399999999999" y="262.0" width="225.12000000000003" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="645.0" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">2. registra el pago (PENDING)</text><line x1="472" y1="350" x2="158" y2="350" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="166.04" y="322.0" width="297.92" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="315.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">3. URL de Wompi con firma de integridad</text><line x1="158" y1="410" x2="1132" y2="410" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="492.4" y="382.0" width="305.20000000000005" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="645.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">4. la usuaria paga (tarjeta, PSE, Nequi)</text><line x1="1132" y1="470" x2="488" y2="470" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="704.72" y="442.0" width="210.56000000000003" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="810.0" y="459.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">5. evento firmado (webhook)</text><line x1="488" y1="530" x2="802" y2="530" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="510.6" y="502.0" width="268.8" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="645.0" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">6. apply_payment → plan por 30 días</text><line x1="488" y1="590" x2="1442" y2="590" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="867.0" y="562.0" width="196.00000000000003" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="965.0" y="579.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">7. correo de confirmación</text><line x1="158" y1="650" x2="472" y2="650" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="202.44" y="622.0" width="225.12000000000003" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="315.0" y="639.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">8. al volver: GET /status?id=</text><line x1="488" y1="710" x2="1132" y2="710" stroke="#6f6466" stroke-width="2" marker-end="url(#pf)"/><rect x="708.36" y="682.0" width="203.28000000000003" height="24" rx="6" fill="#fff" stroke="#d9cdc9"/><text x="810.0" y="699.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24191a" font-weight="normal" text-anchor="middle">9. consulta el estado real</text></svg>
